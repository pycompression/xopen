[build-system]
requires = ["setuptools >= 77.0.3", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "xopen"
authors = [
    {name = "Marcel Martin", email = "marcel.martin@scilifelab.se"},
    {name = "Ruben Vorderman", email = "r.h.p.vorderman@lumc.nl"}
]
description = "Open compressed files transparently"
readme = "README.rst"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3"
]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    'isal>=1.6.1; platform.machine == "x86_64" or platform.machine == "AMD64" or platform.machine == "aarch64"',
    'zlib-ng>=0.4.1; platform.machine == "x86_64" or platform.machine == "AMD64" or platform.machine == "aarch64"',
    'backports.zstd; python_version < "3.14"',
]

[project.urls]
homepage = "https://github.com/pycompression/xopen/"

[project.optional-dependencies]
dev = ["pytest"]
lz4 = ['lz4>=4.4.5; platform_python_implementation != "PyPy"']
zstd = []  # Leave this in here for backwards compatibility (Zstandard support used to be optional)

[tool.setuptools_scm]
write_to = "src/xopen/_version.py"

[tool.ruff.lint]
ignore = [
    "B008",    # Do not perform function call `_ProgramSettings` in argument defaults; instead, perform the call within the function, or read the default from a module-level singleton variable
    "C408",    # Unnecessary `dict()` call (rewrite as a literal)
    "PLW1510", # `subprocess.run` without explicit `check` argument
    "SIM115",  # Use a context manager for opening files
    "SIM117",  # Use a single `with` statement with multiple contexts instead of nested `with` statements
]

[tool.pytest.ini_options]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "@overload",
]
